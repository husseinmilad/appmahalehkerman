<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بدون اتصال — قرارگاه مردمی مدافعان وطن</title>
<meta name="theme-color" content="#0a3d1a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{--ac:#0b6e5b;--bg:#eaf3f1;--tx:#10292b;--mut:#4a6466}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a1c;--tx:#eaf4f2;--mut:#a6bfbd;--ac:#12806a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 15% 8%,#9fe0cf,transparent 45%),radial-gradient(circle at 92% 35%,#a9c8f0,transparent 50%),var(--bg);color:var(--tx);font:400 17px/1.9 Tahoma,sans-serif;text-align:center}
.c{max-width:420px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:26px 20px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
img{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
h1{font-size:1.15em;margin:14px 0 6px}
p{color:var(--mut);font-size:.95em;margin:6px 0}
button{margin-top:14px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <img src="icons/icon-192.png" alt="لوگو">
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>برای دیدن آخرین اخبار و مراسمات به اینترنت نیاز است. وقتی اتصال برقرار شد، برنامه به‌صورت خودکار به‌روز می‌شود.</p>
  <button onclick="location.reload()">تلاش دوباره</button>
</div>
<script>addEventListener('online',()=>location.reload())</script>
</body>
</html>
