<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرارگاه مردمی مدافعان وطن – محله کرمان</title>
<meta name="theme-color" content="#0a3d1a">
<meta name="description" content="قرارگاه مردمی مدافعان وطن — محله کرمان، شهر تهران: مراسمات، اخبار، گزارش‌های تصویری، نذورات و فرم همکاری">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قرارگاه کرمان">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf3f1;--b1:#9fe0cf;--b2:#a9c8f0;--b3:#f3dca6;--tx:#10292b;--mut:#4a6466;--gl:rgba(255,255,255,.55);--gb:rgba(255,255,255,.85);--inp:rgba(255,255,255,.8);--ac:#0b6e5b;--dn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a1c;--b1:#0f5a4b;--b2:#173f73;--b3:#4a3a14;--tx:#eaf4f2;--mut:#a6bfbd;--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.18);--inp:rgba(0,0,0,.3);--ac:#12806a;--dn:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1a1c;--b1:#0f5a4b;--b2:#173f73;--b3:#4a3a14;--tx:#eaf4f2;--mut:#a6bfbd;--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.18);--inp:rgba(0,0,0,.3);--ac:#12806a;--dn:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:400 calc(17px*var(--fs,1))/1.9 Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:radial-gradient(circle at 15% 8%,var(--b1),transparent 45%),radial-gradient(circle at 92% 35%,var(--b2),transparent 50%),radial-gradient(circle at 25% 95%,var(--b3),transparent 50%),var(--bg);background-attachment:fixed}
#app{max-width:600px;margin:0 auto;padding:24px 14px 110px}
.g{background:var(--gl);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0;font-size:1.35em;font-weight:800;line-height:1.5}
h2{font-size:1.25em;margin:6px 0 12px;font-weight:800}
h3{margin:4px 0;font-size:1.05em;font-weight:800}
p{margin:6px 0}.mut{color:var(--mut);font-size:.88em}.pre{white-space:pre-wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;padding:12px;font:inherit;font-weight:700;background:var(--ac);color:#fff;text-decoration:none;cursor:pointer;margin:8px 0}
.btn.s{background:var(--gl);color:var(--tx);border:1px solid var(--gb)}.btn.off{opacity:.5;pointer-events:none}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:14px;border:1px solid var(--gb);background:var(--inp);color:var(--tx);margin:4px 0 10px}
label{font-weight:600;font-size:.95em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.wrap{flex-wrap:wrap}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--gb);background:var(--gl);font:inherit;color:var(--tx);cursor:pointer;margin:0}
.chip.on,.ck:has(input:checked){background:var(--ac);color:#fff}
.ck input{width:auto;margin:0 0 0 6px}
nav{position:fixed;inset:auto 0 0 0;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--gl);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--gb);z-index:20}
nav button{flex:1;border:0;background:none;font:inherit;font-size:.74em;color:var(--mut);display:flex;flex-direction:column;align-items:center;cursor:pointer}
nav button i{font-style:normal;font-size:1.7em;line-height:1.3}nav button.on{color:var(--ac);font-weight:800}
.hero{height:210px;border-radius:26px;margin-bottom:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0e7c66,#1d4e89) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.7))}.hero>*{position:relative}
.wx{position:absolute!important;top:12px;left:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 14px;font-weight:600;font-size:.9em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{margin:0;text-align:center;cursor:pointer;font:inherit;color:var(--tx);padding:18px 8px}.tile i{display:block;font-style:normal;font-size:2.1em}
.bd{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.8em;font-weight:700;background:var(--ac);color:#fff}.bd.live{background:#c2410c}.bd.past{background:#6b7b7a}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gb)}.row:last-child{border:0}
.mini{border:1px solid var(--gb);background:var(--gl);color:var(--tx);border-radius:10px;font:inherit;font-size:.85em;padding:4px 10px;margin-inline-start:4px;cursor:pointer}.mini.d{color:var(--dn)}
.num{direction:ltr;text-align:center;font-size:1.25em;font-weight:800;letter-spacing:1px;word-break:break-all}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block}.grid div{cursor:pointer}
a.row{color:var(--tx);text-decoration:none}
#toast{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;z-index:60;display:none}#toast div{max-width:560px;margin:auto;background:var(--ac);color:#fff;border-radius:16px;padding:12px 16px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#ov img{max-width:100%;max-height:100%;border-radius:12px}
.flag{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 10px);background:linear-gradient(#239f40 0 33.4%,#fff 0 66.7%,#da0000 0);z-index:40;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.logo{position:absolute!important;top:12px;right:12px;width:74px;height:74px;box-shadow:0 4px 16px rgba(0,0,0,.45);border-radius:18px}
.jd{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:6px}
.th{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.th div{position:relative}.th img{width:76px;height:76px;object-fit:cover;border-radius:12px;display:block}.th button{position:absolute;top:2px;left:2px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.gd{position:relative;aspect-ratio:16/9;border:2px dashed var(--ac);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;font-size:.8em;margin:8px 0;padding-bottom:4px}.gd::after{content:"";position:absolute;inset:14% 24%;border:2px solid var(--ac);border-radius:8px}
.rc img{width:100%;height:170px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:block}
.det img{width:100%;border-radius:16px;margin:8px 0;display:block}video,audio{width:100%;margin:8px 0;border-radius:12px}
.tk{padding:10px 0;overflow:hidden;direction:ltr;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tk .tr{display:inline-flex;animation:tk var(--d,30s) linear infinite;will-change:transform}.tk .gp{display:inline-flex}.tk span{direction:rtl;padding:0 22px;font-weight:600}
@keyframes tk{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.tk{overflow-x:auto}.tk .tr{animation:none}}
.cdb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.cdb div{background:var(--inp);border:1px solid var(--gb);border-radius:16px;padding:8px 2px;text-align:center}.cdb b{display:block;font-size:1.7em;line-height:1.35;font-variant-numeric:tabular-nums}.cdb span{font-size:.8em;color:var(--mut)}
.loc{border-top:1px solid var(--gb);margin-top:10px;padding-top:8px}.lb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.logo{-webkit-user-select:none;user-select:none}
</style>
</head>

function g2j(gy,gm,gd){var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;var gy2=(gm>2)?(gy+1):gy;var days=(365*gy)+(parseInt((gy2+3)/4))-(parseInt((gy2+99)/100))+(parseInt((gy2+399)/400))-80+gd+g_d_m[gm-1];jy+=33*(parseInt(days/12053));days%=12053;jy+=4*(parseInt(days/1461));days%=1461;if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}var jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);var jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd]}
function j2g(jy,jm,jd){var gy=(jy<=979)?621:1600;jy-=(jy<=979)?0:979;var days=(365*jy)+((parseInt(jy/33))*8)+parseInt(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);gy+=400*(parseInt(days/146097));days%=146097;if(days>36524){gy+=100*parseInt(--days/36524);days%=36524;if(days>=365)days++}gy+=4*(parseInt(days/1461));days%=1461;if(days>365){gy+=parseInt((days-1)/365);days=(days-1)%365}var gd=days+1;var sal_a=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=0;gm<13;gm++){var v=sal_a[gm];if(gd<=v)break;gd-=v}return[gy,gm,gd]}

function lb(id,i){const r=S.reports.find(x=>x.id==id);if(!r)return;$('#ov').innerHTML=`<img src="${esc(imgsOf(r)[i])}" alt="">`;$('#ov').style.display='flex'}
function moreV(){const B=(t,i,x)=>`<button class="btn s" onclick="${x}">${i} ${t}</button>`;
return `<h2>بیشتر</h2><div class="g">${!S.hide.collab?B('فرم همکاری','🤝',"go('collab')"):''}${!S.hide.contact?B('ارتباط با خادمان و انتقادات و پیشنهادات','💬',"go('contact')"):''}</div>
<div class="g"><h3>تنظیمات ظاهر</h3><div class="chips"><button class="chip" onclick="fs(-.1)">A−</button><button class="chip" onclick="fs(.1)">A+</button><button class="chip" onclick="th('auto')">خودکار</button><button class="chip" onclick="th('light')">روشن</button><button class="chip" onclick="th('dark')">تیره</button></div>${B('فعال‌سازی اعلان مراسمات','🔔','askNotif()')}${installEvt?B('نصب برنامه روی گوشی','📲','installApp()'):''}${B('اشتراک‌گذاری برنامه','🔗','shareApp()')}</div>
<p class="mut" style="text-align:center;opacity:.3;font-size:.75em" onclick="secret()">نسخه ${fa(APP_VER)}${nVer()?' · اندروید '+nVer():''}</p>`}
function fs(d){S.fs=Math.max(.9,Math.min(1.5,+(S.fs+d).toFixed(2)));save();render()}
function th(t){S.theme=t;save();applyTheme()}
function applyTheme(){const r=document.documentElement;S.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
/* ---------- version ---------- */
const APP_VER='1.0.0';
const nVer=()=>{try{return window.Android&&Android.version?fa(Android.version()):''}catch(e){return ''}};
/* ---------- admin ---------- */
const F={news:{t:'اخبار',f:[['title','عنوان خبر'],['body','متن خبر','ta']],row:x=>x.title},
events:{t:'مراسمات',f:[['title','عنوان مراسم'],['date','تاریخ (شمسی)','jdate'],['time','ساعت شروع','time'],['place','نام مکان برگزاری (مثلاً حسینیه ...)'],['addr','آدرس کامل (خیابان، کوچه، پلاک)'],['geo','مختصات روی نقشه برای مسیریابی (مثلاً 35.7448,51.3753) یا لینک گوگل‌مپ — در گوگل‌مپ یا نشان روی محل نگه دارید تا مختصات نمایش داده شود'],['desc','توضیحات','ta'],['dur','مدت برگزاری (ساعت)','num'],['lead','اعلان چند دقیقه قبل از شروع ارسال شود؟','num']],row:x=>x.title+' — '+D(x.date,x.time)},
reports:{t:'گزارش‌ها',f:[['type','نوع گزارش','sel'],['title','عنوان گزارش'],['date','تاریخ مراسم (شمسی)','jdate'],['text','متن گزارش','ta'],['url','لینک فیلم یا صدا (اختیاری)'],['img','تصاویر گزارش (می‌توانید چند عکس را با هم انتخاب کنید)','img']],row:x=>RT[x.type].split(' ')[0]+' '+x.title}};
function fm(k){const e=(adm.id&&S[k].find(x=>x.id==adm.id))||{};return F[k].f.map(([n,l,t])=>`<label>${l}</label>`+(t=='ta'?`<textarea id="f_${n}" rows="5">${esc(e[n])}</textarea>`:t=='sel'?`<select id="f_${n}">${[['photo','عکس'],['video','فیلم'],['audio','صوت']].map(o=>`<option value="${o[0]}" ${e[n]==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:t=='jdate'?jd('f_'+n,e[n]||today()):t=='img'?`<div class="th" id="th">${thumbs()}</div><input type="file" accept="image/*" multiple onchange="pick(this,900,v=>{pend.push(v);$('#th').innerHTML=thumbs()})">`:`<input id="f_${n}" type="${t=='num'?'number':t||'text'}" value="${esc(e[n])}">`)).join('')}
const thumbs=()=>pend.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button onclick="pend.splice(${i},1);$('#th').innerHTML=thumbs()">✕</button></div>`).join('');
function sv(k){const o={};F[k].f.forEach(([n,,t])=>{if(t=='jdate')o[n]=jv('f_'+n);else if(t!='img')o[n]=$('#f_'+n).value.trim()});if(!o.title)return toast('عنوان را وارد کنید');if(k=='reports'){o.imgs=pend.slice();if(!o.text&&!o.imgs.length&&!o.url)return toast('متن، تصویر یا لینک اضافه کنید')}
const e=adm.id&&S[k].find(x=>x.id==adm.id);if(e){Object.assign(e,o);delete e.nt}else{o.id=uid();if(k=='news')o.date=today();S[k].unshift(o)}pend=[];adm.id=null;save();toast('ذخیره شد ✓');render()}
function ed(k,id){adm.id=id;pend=k=='reports'?imgsOf(S[k].find(x=>x.id==id)).slice():[];render();scrollTo(0,0)}
function rm(k,id){if(adm.del!=k+id){adm.del=k+id;return render()}S[k]=S[k].filter(x=>x.id!=id);adm.del=null;save();render()}
const lst=k=>`<div class="g"><h3>${F[k]?F[k].t:k} (${fa(S[k].length)})</h3>${S[k].map(x=>`<div class="row"><span>${esc(F[k].row(x))}</span><span><button class="mini" onclick="ed('${k}','${x.id}')">ویرایش</button><button class="mini d" onclick="rm('${k}','${x.id}')">${adm.del==k+x.id?'مطمئنید؟':'حذف'}</button></span></div>`).join('')||'<p class="mut">موردی ثبت نشده است.</p>'}</div>`;
const inp=(id,l,v,x)=>`<label>${l}</label><input id="${id}" value="${esc(v)}" ${x||''}>`;
function admV(){if(!adm.ok)return `<h2>ورود مدیر</h2><div class="g"><label>رمز عبور مدیر</label><input id="pin" type="password" inputmode="numeric"><button class="btn" onclick="login()">ورود</button></div>`;
const T=[['news','اخبار'],['events','مراسمات'],['reports','گزارش‌ها'],['pay','پرداخت'],['set','تنظیمات'],['ann','📣 اعلان'],['inbox','پیام‌ها']],s=adm.s;let b='';
if(F[s])b=`<div class="g"><h3>${adm.id?'ویرایش':'افزودن'}</h3>${fm(s)}<button class="btn" onclick="sv('${s}')">ذخیره</button>${adm.id?`<button class="btn s" onclick="adm.id=null;pend=[];render()">انصراف</button>`:''}</div>${lst(s)}`;
if(s=='pay')b=`<div class="g">${inp('p_l','لینک درگاه پرداخت اینترنتی',S.pay.link,'dir="ltr"')}${inp('p_c','شماره کارت',S.pay.card,'dir="ltr"')}${inp('p_s','شماره شبا',S.pay.sheba,'dir="ltr"')}${inp('p_o','به نام',S.pay.owner)}<button class="btn" onclick="S.pay={link:$('#p_l').value.trim(),card:$('#p_c').value.trim(),sheba:$('#p_s').value.trim(),owner:$('#p_o').value.trim()};save();toast('ذخیره شد ✓')">ذخیره</button></div>`;
if(s=='set')b=`<div class="g"><h3>🔗 اتصال به گیت‌هاب (انتشار برای همه)</h3><p class="mut">هر چه ادمین ثبت کند در مخزن گیت‌هاب ذخیره و برای همه‌ی کاربران منتشر می‌شود. برای اتصال یک توکن لازم است: github.com ← Settings ← Developer settings ← Fine-grained tokens ← Generate new token. فقط مخزن <b>appmahalehkerman</b> را انتخاب کنید و دسترسی <b>Contents: Read and write</b> بدهید. توکن فقط روی همین گوشی می‌ماند؛ آن را به کسی ندهید.</p><label>توکن</label><input id="g_t" type="password" dir="ltr" value="${esc(S.token)}"><button class="btn" onclick="S.token=$('#g_t').value.trim();save();testGh()">ذخیره و تست اتصال</button><button class="btn s" onclick="lastPub='';pubSoon()">انتشار همه‌ی محتوا همین حالا</button><p class="mut">وضعیت: ${S.token?'توکن ثبت شده':'متصل نیست'}</p></div><div class="g"><h3>عکس بالای صفحه اول</h3><p class="mut">📐 <b>اندازه‌ی پیشنهادی: ۱۲۰۰×۶۷۵ پیکسل</b> (نسبت ۱۶:۹، افقی)، فرمت JPG یا PNG. برنامه خودش عکس را فشرده می‌کند.<br>چون عکس روی گوشی‌های مختلف کمی بریده می‌شود، سوژه‌ی اصلی را داخل کادر پررنگ (وسط عکس) بگذارید. لوگو و نوشته روی عکس می‌آیند؛ بالا-راست و پایین عکس را شلوغ نکنید.</p><div class="gd">کادر پررنگ = محدوده‌ی امن سوژه</div><input type="file" accept="image/*" onchange="pick(this,1200,v=>{S.banner=v;save();render()})"><button class="btn s" onclick="S.banner='';save();render()">حذف عکس</button></div>
<div class="g"><h3>وضع هوا (جایگزین دستی)</h3><p class="mut">هوای تهران به‌صورت آنلاین دریافت می‌شود؛ این مقدار فقط وقتی استفاده می‌شود که اینترنت یا سرور هواشناسی در دسترس نباشد.</p>${inp('w_t','دما (درجه سانتی‌گراد)',S.weather.t,'inputmode="numeric"')}<label>وضعیت</label><select id="w_c">${WI.map(x=>`<option ${S.weather.c==x[0]?'selected':''}>${x[0]}</option>`).join('')}</select><button class="btn" onclick="S.weather={t:$('#w_t').value.trim(),c:$('#w_c').value};save();toast('ذخیره شد ✓')">ثبت وضع هوا</button></div>
<div class="g"><h3>شماره تماس خادمان</h3>${inp('t_p','شماره',S.phone,'type="tel" dir="ltr"')}<button class="btn" onclick="S.phone=$('#t_p').value.trim();save();toast('ذخیره شد ✓')">ذخیره</button></div>
<div class="g"><h3>نمایش بخش‌ها</h3>${[['events','مراسمات'],['pay','نذورات'],['collab','همکاری'],['contact','ارتباط'],['reports','گزارش‌ها']].map(x=>`<label class="chip ck" style="display:block;margin:4px 0"><input type="checkbox" ${S.hide[x[0]]?'':'checked'} onchange="S.hide['${x[0]}']=!this.checked;save();render()">${x[1]}</label>`).join('')}</div>
<div class="g"><h3>رمز مدیر</h3>${inp('n_p','رمز جدید (حداقل ۴ رقم)','','type="password" inputmode="numeric"')}<button class="btn" onclick="const v=$('#n_p').value.trim();if(v.length<4)return toast('رمز کوتاه است');S.pin=v;save();toast('رمز تغییر کرد ✓')">تغییر رمز</button><button class="btn s" onclick="notify('آزمایش اعلان','اعلان‌ها درست کار می‌کند',1)">🔔 ارسال اعلان آزمایشی</button><button class="btn s" onclick="if(adm.del!='reset'){adm.del='reset';return render()}S=defs();adm.del=null;save();render()">${adm.del=='reset'?'مطمئنید؟ همه‌چیز پاک می‌شود':'بازنشانی کل برنامه'}</button></div>`;
if(s=='ann')b=`<div class="g"><h3>ارسال اعلان به همه‌ی کاربران</h3><p class="mut">اعلان روی گوشی همه‌ی کسانی که برنامه را نصب کرده‌اند نمایش داده می‌شود (معمولاً ظرف ۱۵ تا ۳۰ دقیقه).</p><label>عنوان</label><input id="a_t"><label>متن اعلان</label><textarea id="a_b" rows="4"></textarea><button class="btn" onclick="sendAnn()">📣 ارسال اعلان</button></div><div class="g"><h3>اعلان‌های ارسال‌شده</h3>${S.ann.map(a=>`<div class="row"><span>${esc(a.title)}<br><span class="mut">${D(iso(a.at))}</span></span><button class="mini d" onclick="rm('ann','${a.id}')">${adm.del=='ann'+a.id?'مطمئنید؟':'حذف'}</button></div>`).join('')||'<p class="mut">اعلانی نیست.</p>'}</div>`;
if(s=='inbox')b=`<div class="g"><h3>فرم‌های همکاری (${fa(S.collab.length)})</h3>${S.collab.map(c=>`<div class="row"><span><b>${esc(c.n)}</b> — <a href="tel:${esc(c.p)}">${esc(c.p)}</a><br><span class="mut">${esc(c.t.join('، '))}${c.d?' | '+esc(c.d):''}</span></span><button class="mini d" onclick="rm('collab','${c.id}')">${adm.del=='collab'+c.id?'مطمئنید؟':'حذف'}</button></div>`).join('')||'<p class="mut">فرمی نیست.</p>'}</div>
<div class="g"><h3>انتقادات، پیشنهادات و پیام‌ها (${fa(S.msgs.length)})</h3>${S.msgs.map(c=>`<div class="row"><span><span class="bd">${esc(c.k)}</span> ${esc(c.n)}<br><span class="pre">${esc(c.t)}</span></span><button class="mini d" onclick="rm('msgs','${c.id}')">${adm.del=='msgs'+c.id?'مطمئنید؟':'حذف'}</button></div>`).join('')||'<p class="mut">پیامی نیست.</p>'}</div>`;
return `<h2>🔐 پنل مدیریت</h2><div class="chips">${T.map(x=>`<button class="chip ${s==x[0]?'on':''}" onclick="adm.s='${x[0]}';adm.id=null;pend=[];adm.del=null;render()">${x[1]}</button>`).join('')}<button class="chip" onclick="adm.ok=0;render()">خروج</button></div>${b}`}
function sendAnn(){const t=$('#a_t').value.trim();if(!t)return toast('عنوان را بنویسید');if(!S.token)toast('ابتدا توکن گیت‌هاب را در «تنظیمات» وارد کنید تا اعلان منتشر شود');const a={id:uid(),title:t,body:$('#a_b').value.trim(),at:Date.now()};S.ann.unshift(a);S.ann=S.ann.slice(0,30);S.seen=(S.seen||[]).concat(a.id);save();render()}
function login(){if($('#pin').value==S.pin){adm.ok=1;render()}else toast('رمز نادرست است')}
/* ---------- shell ---------- */
function go(t){tab=t;rid=null;render();scrollTo(0,0)}
function render(){document.documentElement.style.setProperty('--fs',S.fs);$('#v').innerHTML=({home,events:evV,pay:payV,reports:rpV,more:moreV,collab:colV,contact:ctV,admin:admV}[tab])();cdTick();
$('#nav').innerHTML=[['home','🏠','خانه'],['events','📢','مراسمات'],['pay','💝','نذورات'],['reports','🖼️','گزارش‌ها'],['more','☰','بیشتر']].filter(x=>!S.hide[x[0]]).map(x=>`<button class="${tab==x[0]||(x[0]=='more'&&['collab','contact','admin'].includes(tab))?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}
window.onBack=()=>{if($('#ov').style.display=='flex'){$('#ov').style.display='none';return true}if(rid){rid=null;render();return true}if(tab!='home'){go('home');return true}return false};
/* ---------- PWA: نصب، اشتراک‌گذاری، آفلاین ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;try{render()}catch(x){}});
function installApp(){if(!installEvt)return toast('برای نصب از منوی مرورگر «افزودن به صفحهٔ اصلی» را بزنید');installEvt.prompt();try{installEvt.userChoice.then(()=>{installEvt=null;render()})}catch(e){installEvt=null}}
function shareApp(){const u=location.origin+location.pathname;if(navigator.share)return navigator.share({title:document.title,url:u}).catch(()=>{});cp(u)}
addEventListener('offline',()=>toast('📴 حالت آفلاین — محتوای ذخیره‌شده نمایش داده می‌شود'));
addEventListener('online',()=>{toast('🌐 اتصال برقرار شد');loadRemote()});
if('serviceWorker' in navigator&&location.protocol=='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();render();tick();sync();loadW();loadRemote();setInterval(loadRemote,3e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadRemote()});setInterval(cdTick,1e3);setInterval(tick,3e4);setInterval(loadW,9e5);
</script>
</body>
