name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # پکیج‌های پیش‌نصب‌شده روی رانر، تا نیازی به sdkmanager و دانلود اضافی نباشد
  API_LEVEL: '34'
  BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          if [ ! -d "$SDK" ]; then
            echo "❌ Android SDK روی رانر پیدا نشد"
            exit 1
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "✓ SDK: $SDK"
          ls "$SDK" || true
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: Accept licenses
        run: |
          TOOLS=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -n "$TOOLS" ]; then
            yes | "$TOOLS/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$TOOLS/sdkmanager" --list_installed 2>/dev/null | head -30 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Decode keystore
        id: keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "🔐 امضای رسمی استفاده می‌شود"
          else
            echo "ℹ️ keystore تنظیم نشده — خروجی با امضای debug ساخته می‌شود"
          fi

      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Read version
        id: ver
        run: |
          NAME=$(grep VERSION_NAME android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=$(grep VERSION_CODE android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "نسخه: $NAME (build $CODE)"

      - name: Rename artifacts
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/qarargah-kerman-${V}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/qarargah-kerman-${V}.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/qarargah-kerman-${V}-unsigned.apk"
          fi
          ls -lh out
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Verify APK contents
        id: verify
        run: |
          # روی PR فقط APK دیباگ ساخته می‌شود؛ در غیر این صورت نسخهٔ release را بررسی می‌کنیم
          APK=$(ls out/qarargah-kerman-*.apk | grep -v debug | head -1 || true)
          [ -n "$APK" ] || APK=$(ls out/qarargah-kerman-*.apk | head -1 || true)
          if [ -z "$APK" ]; then echo "::error title=no apk::هیچ فایل APK ساخته نشد"; exit 1; fi
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)" | tr '\n' ' ')
          echo "badging: $BADGING"
          echo "::notice title=APK badging::$BADGING"

          LIST=$(unzip -l "$APK" | awk '{print $4}' | grep -E "^assets/" | head -8 | tr '\n' ' ')
          COUNT=$(unzip -l "$APK" | awk '{print $4}' | grep -cE "^assets/web/")
          echo "assets entries: $COUNT -> $LIST"
          echo "::notice title=APK assets count::$COUNT files: $LIST"

          GEN=$(find android/app/build/generated -name "index.html" 2>/dev/null | head -3 | tr '\n' ' ')
          echo "generated index.html: $GEN"
          if [ -n "$GEN" ]; then echo "::notice title=offline bundle generated::$GEN"; else echo "::warning title=offline bundle::هیچ index.html در build/generated پیدا نشد"; fi

          DEX=$(unzip -l "$APK" | grep -cE "classes[0-9]*\\.dex")
          echo "::notice title=dex files::$DEX"

          if [ "$COUNT" -lt 3 ]; then
            echo "::warning title=offline assets missing::بستهٔ آفلاین در APK نیست (count=$COUNT)"
          else
            echo "::notice title=offline assets ok::بستهٔ آفلاین داخل APK است"
          fi

      - name: Upload APK diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apk-diagnostics
          path: diag/verify.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qarargah-kerman-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: قرارگاه کرمان ${{ steps.ver.outputs.name }}
          body: |
            ## 📱 قرارگاه مردمی مدافعان وطن — محله کرمان

            نسخهٔ ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            ### نصب
            1. فایل `qarargah-kerman-${{ steps.ver.outputs.name }}.apk` را دانلود کنید.
            2. اگر گوشی اجازه نداد، «نصب برنامه‌های ناشناس» را برای مرورگر فعال کنید.
            3. پس از نصب، برای دریافت یادآوری مراسمات: «بیشتر» ← «فعال‌سازی اعلان مراسمات».

            - 🌐 نسخهٔ وب: https://husseinmilad.github.io/appmahalehkerman/docs/
            - 🏠 صفحهٔ دانلود: https://husseinmilad.github.io/appmahalehkerman/

            فایل `-debug.apk` فقط برای تست است.
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
