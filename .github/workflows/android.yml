name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Decode keystore
        id: keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "🔐 امضای رسمی استفاده می‌شود"
          else
            echo "ℹ️ بدون keystore — خروجی با امضای debug ساخته می‌شود"
          fi

      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Read version
        id: ver
        run: |
          NAME=$(grep VERSION_NAME android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=$(grep VERSION_CODE android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/qarargah-kerman-${V}-debug.apk" || true
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/qarargah-kerman-${V}.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/qarargah-kerman-${V}-unsigned.apk"
          fi
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qarargah-kerman-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: قرارگاه کرمان ${{ steps.ver.outputs.name }}
          body: |
            ## 📱 قرارگاه مردمی مدافعان وطن — محله کرمان

            نسخهٔ ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            - فایل `qarargah-kerman-${{ steps.ver.outputs.name }}.apk` را دانلود و روی گوشی نصب کنید.
            - نسخهٔ وب: https://husseinmilad.github.io/appmahalehkerman/
            - در صورت نیاز به فعال‌سازی «نصب از منابع نامشخص»، از تنظیمات گوشی اجازه دهید.

            ساخته‌شده به‌صورت خودکار با GitHub Actions.
          files: out/*.apk
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
